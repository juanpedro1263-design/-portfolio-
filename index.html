<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Juan Graffigna — Color Grading</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link id="gf" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/img-comparison-slider@8/dist/index.js" defer></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/img-comparison-slider@8/dist/styles.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --text: #e8e4de;
      --accent: #c9a96e;
      --surface: color-mix(in srgb, var(--bg) 94%, white);
      --border: color-mix(in srgb, var(--text) 8%, transparent);
      --muted: color-mix(in srgb, var(--text) 45%, transparent);
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-mono: 'DM Mono', monospace;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-weight: 300;
      font-size: 13px;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ── NAV ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; justify-content: space-between; align-items: center;
      padding: 1.5rem 3rem;
      background: linear-gradient(to bottom, var(--bg) 0%, transparent 100%);
    }
    .nav-logo { font-family: var(--font-display); font-size: 1.1rem; font-weight: 300; letter-spacing: 0.08em; color: var(--text); text-decoration: none; }
    .nav-links { display: flex; gap: 2.5rem; list-style: none; }
    .nav-links a { color: var(--muted); text-decoration: none; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; transition: color 0.2s; }
    .nav-links a:hover { color: var(--text); }

    /* ── HERO ── */
    .hero { height: 100vh; display: flex; flex-direction: column; justify-content: flex-end; padding: 4rem 3rem; position: relative; overflow: hidden; }
    .hero-bg {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 70% 40%, color-mix(in srgb, var(--accent) 6%, transparent) 0%, transparent 60%),
        radial-gradient(ellipse 40% 60% at 20% 70%, color-mix(in srgb, var(--accent) 4%, transparent) 0%, transparent 50%);
    }
    .hero > *:not(.hero-bg) { position: relative; }
    .hero-eyebrow { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin-bottom: 1rem; }
    .hero-title { font-family: var(--font-display); font-size: clamp(4rem, 10vw, 8rem); font-weight: 300; line-height: 0.9; letter-spacing: -0.01em; margin-bottom: 2rem; }
    .hero-title em { font-style: italic; color: var(--accent); }
    .hero-sub { color: var(--muted); font-size: 11px; letter-spacing: 0.1em; max-width: 400px; line-height: 1.8; }
    .hero-scroll { position: absolute !important; bottom: 2.5rem; right: 3rem; display: flex; align-items: center; gap: 0.75rem; color: var(--muted); font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; }
    .scroll-line { width: 40px; height: 1px; background: var(--accent); opacity: 0.5; }

    /* ── SECTIONS ── */
    section { padding: 6rem 3rem; }
    .section-label { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin-bottom: 3rem; display: flex; align-items: center; gap: 1rem; }
    .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); max-width: 80px; }

    /* ── GRID ── */
    .work-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 560px), 1fr)); gap: 2px; }
    .work-item { position: relative; background: var(--surface); overflow: hidden; }
    .work-item-inner { position: relative; aspect-ratio: 16/9; overflow: hidden; }

    img-comparison-slider { width: 100%; height: 100%; display: block; --divider-width: 2px; --divider-color: var(--accent); --handle-opacity: 0; }
    img-comparison-slider img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .slider-handle { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); border: 2px solid rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; }
    .slider-arrows { display: flex; gap: 4px; color: var(--bg); font-size: 12px; }

    .video-wrapper { position: relative; aspect-ratio: 16/9; overflow: hidden; background: #000; }
    .video-wrapper iframe, .video-wrapper video { width: 100%; height: 100%; border: none; display: block; }
    .empty-media { aspect-ratio: 16/9; display: grid; place-items: center; color: var(--muted); font-size: 11px; letter-spacing: 0.1em; background: var(--surface); }

    .work-meta { padding: 1rem 1.25rem; display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; border-top: 1px solid var(--border); }
    .work-title { font-family: var(--font-display); font-size: 1rem; font-weight: 300; letter-spacing: 0.02em; }
    .work-tags { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: flex-end; }
    .tagwrap { display: inline-flex; align-items: center; gap: 2px; }
    .work-tag { font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--border); padding: 2px 8px; border-radius: 2px; }
    .work-tag.accent { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 25%, transparent); }

    /* ── ABOUT ── */
    .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: start; }
    .about-title { font-family: var(--font-display); font-size: clamp(2.5rem, 5vw, 4rem); font-weight: 300; line-height: 1.1; margin-bottom: 2rem; }
    .about-title em { font-style: italic; color: var(--accent); }
    .about-body { color: var(--muted); line-height: 1.9; font-size: 12px; }
    .about-body p + p, .about-body .prow + .prow { margin-top: 1rem; }
    .services-list { list-style: none; display: flex; flex-direction: column; }
    .services-list li { display: flex; align-items: center; gap: 1rem; padding: 1rem 0; border-bottom: 1px solid var(--border); font-size: 11px; letter-spacing: 0.05em; }
    .services-list li::before { content: '—'; color: var(--accent); flex-shrink: 0; }
    .services-list li > span:first-child { flex: 1; }

    /* ── CONTACT ── */
    .contact-section { border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: flex-end; }
    .contact-title { font-family: var(--font-display); font-size: clamp(3rem, 7vw, 6rem); font-weight: 300; line-height: 0.9; }
    .contact-title em { font-style: italic; color: var(--accent); }
    .contact-links { display: flex; flex-direction: column; align-items: flex-end; gap: 0.75rem; }
    .cl-row { display: flex; align-items: center; gap: 0.4rem; }
    .contact-link { color: var(--muted); text-decoration: none; font-size: 11px; letter-spacing: 0.1em; transition: color 0.2s; display: flex; align-items: center; gap: 0.5rem; }
    .contact-link:hover { color: var(--accent); }

    footer { padding: 2rem 3rem; border-top: 1px solid var(--border); display: flex; justify-content: space-between; color: var(--muted); font-size: 10px; letter-spacing: 0.1em; }

    @media (max-width: 768px) {
      nav { padding: 1.25rem 1.5rem; }
      .nav-links { gap: 1.5rem; }
      .hero { padding: 2rem 1.5rem 3rem; }
      section { padding: 4rem 1.5rem; }
      .about-grid { grid-template-columns: 1fr; gap: 2rem; }
      .contact-section { flex-direction: column; gap: 2rem; align-items: flex-start; }
      .contact-links { align-items: flex-start; }
      footer { flex-direction: column; gap: 0.5rem; padding: 2rem 1.5rem; }
    }

    /* ── MODO EDICIÓN (solo visible con ?edit) ── */
    body.editing { padding-bottom: 90px; }
    body.editing [data-p] { outline: 1px dashed transparent; outline-offset: 3px; cursor: text; transition: outline-color .15s; min-width: 1ch; }
    body.editing [data-p]:hover { outline-color: color-mix(in srgb, var(--accent) 50%, transparent); }
    body.editing [data-p]:focus { outline: 1px solid var(--accent); }
    body.editing [data-p]:empty::before { content: '(vacío)'; opacity: .35; }
    .ed-tools { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px; background: #1b1b1b; border-top: 1px solid var(--border); }
    .ed-btn, .x, #bar button, .box button {
      font: 11px/1 var(--font-mono); letter-spacing: .06em; color: #e8e4de; background: #262626;
      border: 1px solid #3a3a3a; padding: 7px 10px; border-radius: 3px; cursor: pointer;
    }
    .ed-btn:hover, .x:hover, #bar button:hover, .box button:hover { border-color: var(--accent); }
    .danger { color: #ff8a80 !important; }
    .x { padding: 2px 6px; font-size: 10px; color: #ff8a80; }
    .add { margin-top: 1rem; }
    .prow { display: flex; gap: 8px; align-items: flex-start; }
    .prow > p { flex: 1; }
    #bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 300; display: flex; gap: 8px; align-items: center; padding: 12px 16px; background: #141414; border-top: 1px solid #333; color: #e8e4de; font: 12px var(--font-mono); }
    #bar[hidden], #modal[hidden] { display: none; }
    #bar #st { flex: 1; min-width: 0; }
    #bar #st.err { color: #ff8a80; }
    #bar .pri, .box .pri { background: var(--accent); color: #0a0a0a; border-color: var(--accent); font-weight: 400; }
    #modal { position: fixed; inset: 0; z-index: 400; background: rgba(0,0,0,.75); display: grid; place-items: center; padding: 16px; overflow-y: auto; }
    .box { width: min(440px, 100%); background: #181818; border: 1px solid #333; border-radius: 6px; padding: 20px; color: #e8e4de; display: flex; flex-direction: column; gap: 12px; max-height: 95vh; overflow-y: auto; }
    .box h3 { font: 400 1.3rem var(--font-display); }
    .box label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; letter-spacing: .05em; }
    .box small { opacity: .5; font-size: 10px; }
    .box input, .box select { font: 12px var(--font-mono); background: #0e0e0e; color: #e8e4de; border: 1px solid #3a3a3a; padding: 8px; border-radius: 3px; width: 100%; }
    .box input[type=color] { height: 36px; padding: 2px; }
    .box .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }

    /* ── Tamaño y posición por texto (se guardan en content.json → "style") ── */
    [data-p]:is(span, em, a) { display: inline-block; }
    @media (min-width: 769px) { [data-p] { translate: var(--x, 0) var(--y, 0); } }
    #tb { position: fixed; z-index: 350; display: flex; align-items: center; gap: 6px; padding: 6px; background: #141414; border: 1px solid var(--accent); border-radius: 4px; box-shadow: 0 4px 20px rgba(0,0,0,.5); }
    #tb[hidden] { display: none; }
    #tb button { font: 11px/1 var(--font-mono); color: #e8e4de; background: #262626; border: 1px solid #3a3a3a; padding: 7px 10px; border-radius: 3px; cursor: pointer; }
    #tb button:hover { border-color: var(--accent); }
    #tb #tbm { cursor: grab; touch-action: none; user-select: none; }
    #guides { position: fixed; inset: 0; z-index: 340; pointer-events: none; }
    .gl { position: fixed; background: #ff4fa3; }
    .gv { top: 0; bottom: 0; width: 1px; }
    .gh { left: 0; right: 0; height: 1px; }
    #tb #tbs { font: 11px var(--font-mono); color: #e8e4de; min-width: 38px; text-align: center; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="bar" hidden></div>
  <div id="modal" hidden></div>
  <div id="guides"></div>
  <div id="tb" hidden><button data-t="dn" title="Achicar">A−</button><span id="tbs">100%</span><button data-t="up" title="Agrandar">A+</button><button id="tbm" title="Arrastrá para mover">✥ mover</button><button data-t="rs" title="Volver a tamaño y lugar originales">↺</button></div>

<script>
(() => {
  /* ───────── Config ───────── */
  const DISPLAY = {
    'Cormorant Garamond': '0,300;0,400;1,300',
    'Playfair Display': '0,400;1,400',
    'DM Serif Display': '0,400;1,400',
    'Fraunces': '0,300;0,400;1,300',
    'Libre Caslon Text': '0,400;1,400',
    'Bodoni Moda': '0,400;1,400',
    'Instrument Serif': '0,400;1,400'
  };
  const BODY = {
    'DM Mono': '300;400', 'Space Mono': '400', 'IBM Plex Mono': '300;400',
    'JetBrains Mono': '300;400', 'Inter': '300;400', 'Work Sans': '300;400', 'Manrope': '300;400'
  };

  let C = null, uploads = {}, previews = {}, dirty = false;
  const editing = new URLSearchParams(location.search).has('edit');
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  const cfgGet = () => { try { return JSON.parse(localStorage.getItem('pf_cfg') || '{}'); } catch { return {}; } };
  const cfgSet = o => { try { localStorage.setItem('pf_cfg', JSON.stringify({ ...cfgGet(), ...o })); } catch {} };
  const guessRepo = () => {
    const h = location.hostname;
    if (!h.endsWith('.github.io')) return '';
    const o = h.split('.')[0], r = location.pathname.split('/')[1];
    return r && !r.includes('.') ? `${o}/${r}` : `${o}/${o}.github.io`;
  };

  const get = p => p.split('.').reduce((o, k) => o?.[k], C);
  const set = (p, v) => { const k = p.split('.'), l = k.pop(); k.reduce((o, x) => o[x], C)[l] = v; dirty = true; };
  const src = p => previews[p] || p;

  /* ───────── Render ───────── */
  const T = (p, tag = 'span', cls = '', attrs = '') => `<${tag} class="${cls}" ${attrs} data-p="${p}">${esc(get(p))}</${tag}>`;
  const ytId = u => { const m = u.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/); return m ? m[1] : (/^[\w-]{11}$/.test(u.trim()) ? u.trim() : ''); };
  const vimeoId = u => { const m = u.match(/vimeo\.com\/(?:.*\/)?(\d+)/); return m ? m[1] : (/^\d+$/.test(u.trim()) ? u.trim() : ''); };

  function applyTheme() {
    const t = C.theme, r = document.documentElement.style;
    r.setProperty('--accent', t.accent); r.setProperty('--bg', t.bg); r.setProperty('--text', t.text);
    r.setProperty('--font-display', `'${t.fontDisplay}', Georgia, serif`);
    r.setProperty('--font-mono', `'${t.fontBody}', system-ui, sans-serif`);
    const href = `https://fonts.googleapis.com/css2?family=${t.fontDisplay.replace(/ /g, '+')}:ital,wght@${DISPLAY[t.fontDisplay] || '0,400;1,400'}&family=${t.fontBody.replace(/ /g, '+')}:wght@${BODY[t.fontBody] || '400'}&display=swap`;
    if ($('#gf').getAttribute('href') !== href) $('#gf').setAttribute('href', href);
    document.title = C.site.title;
  }

  function workItem(w, i) {
    let media;
    if (w.type === 'slider') {
      media = (w.before && w.after)
        ? `<div class="work-item-inner"><img-comparison-slider>
             <img slot="first" src="${esc(src(w.before))}" alt="Before" />
             <img slot="second" src="${esc(src(w.after))}" alt="After" />
             <div slot="handle" class="slider-handle"><div class="slider-arrows">◀ ▶</div></div>
           </img-comparison-slider>
           <span class="before-label">Before</span><span class="after-label">After</span></div>`
        : `<div class="empty-media">Falta imagen before / after</div>`;
    } else if (w.type === 'youtube') {
      media = w.videoId ? `<div class="video-wrapper"><iframe src="https://www.youtube.com/embed/${esc(w.videoId)}?rel=0&modestbranding=1&color=white" title="${esc(w.title)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>` : `<div class="empty-media">Falta link de YouTube</div>`;
    } else if (w.type === 'vimeo') {
      media = w.videoId ? `<div class="video-wrapper"><iframe src="https://player.vimeo.com/video/${esc(w.videoId)}?color=${C.theme.accent.slice(1)}&title=0&byline=0&portrait=0" title="${esc(w.title)}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div>` : `<div class="empty-media">Falta link de Vimeo</div>`;
    } else {
      media = w.src ? `<div class="video-wrapper"><video controls preload="metadata" src="${esc(w.src)}"></video></div>` : `<div class="empty-media">Falta URL del video</div>`;
    }
    const tools = editing ? `<div class="ed-tools">
        <button class="ed-btn" data-act="up" data-i="${i}">↑</button>
        <button class="ed-btn" data-act="down" data-i="${i}">↓</button>
        ${w.type === 'slider'
          ? `<button class="ed-btn" data-act="before" data-i="${i}">Cambiar BEFORE</button><button class="ed-btn" data-act="after" data-i="${i}">Cambiar AFTER</button>`
          : `<button class="ed-btn" data-act="media" data-i="${i}">Cambiar video</button>`}
        <button class="ed-btn danger" data-act="del" data-i="${i}">Eliminar</button>
      </div>` : '';
    const tags = w.tags.map((_, j) => `<span class="tagwrap">${T(`work.${i}.tags.${j}`, 'span', 'work-tag' + (j === 0 ? ' accent' : ''))}${editing ? `<button class="x" data-act="deltag" data-i="${i}" data-j="${j}">×</button>` : ''}</span>`).join('');
    return `<div class="work-item">${media}
      <div class="work-meta">${T(`work.${i}.title`, 'span', 'work-title')}
        <div class="work-tags">${tags}${editing ? `<button class="x" style="color:inherit" data-act="addtag" data-i="${i}">+ tag</button>` : ''}</div>
      </div>${tools}</div>`;
  }

  function render() {
    applyTheme();
    const s = C.site, a = C.about, c = C.contact;
    $('#app').innerHTML = `
      <nav>${T('site.logo', 'a', 'nav-logo', 'href="#"')}
        <ul class="nav-links"><li><a href="#work">Work</a></li><li><a href="#about">About</a></li><li><a href="#contact">Contact</a></li></ul></nav>
      <header class="hero"><div class="hero-bg"></div>
        ${T('site.eyebrow', 'p', 'hero-eyebrow')}
        <h1 class="hero-title">${T('site.heroFirst')}<br/>${T('site.heroLast', 'em')}</h1>
        ${T('site.heroSub', 'p', 'hero-sub')}
        <div class="hero-scroll"><span class="scroll-line"></span>${T('site.scroll')}</div>
      </header>
      <section id="work"><p class="section-label">Trabajos</p>
        <div class="work-grid">${C.work.map(workItem).join('')}</div>
        ${editing ? `<button class="ed-btn add" data-act="addwork">+ Agregar trabajo</button>` : ''}
      </section>
      <section id="about">${T('about.label', 'p', 'section-label')}
        <div class="about-grid"><div>
          <h2 class="about-title">${T('about.t1')}<br/>${T('about.tEm', 'em')}<br/>${T('about.t3')}</h2>
          <div class="about-body">${a.paragraphs.map((_, i) => `<div class="prow">${T(`about.paragraphs.${i}`, 'p')}${editing ? `<button class="x" data-act="delp" data-i="${i}">×</button>` : ''}</div>`).join('')}
            ${editing ? `<button class="ed-btn add" data-act="addp">+ Párrafo</button>` : ''}</div>
        </div><div>
          <ul class="services-list">${a.services.map((_, i) => `<li>${T(`about.services.${i}`)}${editing ? `<button class="x" data-act="delsvc" data-i="${i}">×</button>` : ''}</li>`).join('')}</ul>
          ${editing ? `<button class="ed-btn add" data-act="addsvc">+ Servicio</button>` : ''}
        </div></div>
      </section>
      <section id="contact" class="contact-section"><div>
        <h2 class="contact-title">${T('contact.t1')}<br/>${T('contact.t2')} ${T('contact.tEm', 'em')}</h2></div>
        <div class="contact-links">${c.links.map((l, i) => `<div class="cl-row"><a class="contact-link" href="${esc(l.href)}" target="_blank" rel="noopener">→ ${T(`contact.links.${i}.label`)}</a>${editing ? `<button class="x" style="color:inherit" data-act="editlink" data-i="${i}">✎ link</button><button class="x" data-act="dellink" data-i="${i}">×</button>` : ''}</div>`).join('')}
          ${editing ? `<button class="ed-btn add" data-act="addlink">+ Contacto</button>` : ''}</div>
      </section>
      <footer>${T('site.footerLeft')}${T('site.footerRight')}</footer>`;
    applyStyles();
    if (editing) document.querySelectorAll('[data-p]').forEach(el => { el.contentEditable = 'true'; el.spellcheck = false; });
  }

  /* ───────── Tamaño y posición de textos ───────── */
  function applyEl(el) {
    const st = C.style?.[el.dataset.p] || {}, s = st.s || 1;
    el.style.zoom = s === 1 ? '' : s;
    el.style.setProperty('--x', ((st.x || 0) / s) + 'px');
    el.style.setProperty('--y', ((st.y || 0) / s) + 'px');
  }
  const applyStyles = () => document.querySelectorAll('[data-p]').forEach(applyEl);
  const dropStyles = prefix => { if (C.style) Object.keys(C.style).forEach(k => { if (k.startsWith(prefix)) delete C.style[k]; }); };

  let cur = null;
  function placeTb() {
    const tb = $('#tb'); if (!cur || tb.hidden) return;
    const r = cur.getBoundingClientRect(), h = tb.offsetHeight;
    let top = r.top - h - 8; if (top < 8) top = Math.min(r.bottom + 8, innerHeight - h - 70);
    tb.style.top = top + 'px';
    tb.style.left = Math.max(8, Math.min(r.left, innerWidth - tb.offsetWidth - 8)) + 'px';
    $('#tbs').textContent = Math.round(((C.style?.[cur.dataset.p]?.s) || 1) * 100) + '%';
  }
  function upd(fn) {
    const p = cur.dataset.p; C.style ||= {};
    const st = C.style[p] ||= {}; fn(st);
    if ((st.s ?? 1) === 1 && !st.x && !st.y) delete C.style[p];
    dirty = true; applyEl(cur); placeTb();
  }

  /* ───────── Modal ───────── */
  function ask({ title, fields, ok = 'Aceptar' }) {
    return new Promise(res => {
      const m = $('#modal'); m.hidden = false;
      m.innerHTML = `<form class="box"><h3>${esc(title)}</h3>${fields.map((f, n) => `<label>${esc(f.label)}${
        f.type === 'select'
          ? `<select name="f${n}">${f.options.map(o => `<option ${o === f.value ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`
          : `<input name="f${n}" type="${f.type || 'text'}" ${f.type === 'file' ? 'accept="image/*"' : ''} value="${f.type === 'file' ? '' : esc(f.value || '')}" ${f.ph ? `placeholder="${esc(f.ph)}"` : ''} autocomplete="off">`
      }${f.hint ? `<small>${esc(f.hint)}</small>` : ''}</label>`).join('')}
        <div class="row"><button type="button" data-x>Cancelar</button><button class="pri">${ok}</button></div></form>`;
      const form = m.firstChild;
      const close = v => { m.hidden = true; m.innerHTML = ''; res(v); };
      form.onsubmit = e => { e.preventDefault(); const o = {}; fields.forEach((f, n) => { const el = form.elements['f' + n]; o[f.k] = f.type === 'file' ? el.files[0] : el.value; }); close(o); };
      form.querySelector('[data-x]').onclick = () => close(null);
    });
  }

  async function toJpeg(file) {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 2400 / Math.max(bmp.width, bmp.height));
    const cv = document.createElement('canvas');
    cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
    cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
    return cv.toDataURL('image/jpeg', 0.92);
  }
  async function pickImage(title, current) {
    const r = await ask({ title, fields: [
      { k: 'file', type: 'file', label: 'Subir imagen desde tu equipo', hint: 'Se achica a máx. 2400 px y se guarda como JPG.' },
      { k: 'url', label: 'o pegar una URL', value: current && !current.startsWith('images/') ? current : '' }
    ] });
    if (!r) return null;
    if (r.file) {
      const d = await toJpeg(r.file);
      const slug = r.file.name.replace(/\.[^.]+$/, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').slice(0, 40) || 'img';
      const path = `images/${Date.now()}-${slug}.jpg`;
      uploads[path] = d.split(',')[1]; previews[path] = d;
      return path;
    }
    return r.url.trim() || null;
  }

  /* ───────── Acciones de edición ───────── */
  const mv = (arr, i, d) => { const j = i + d; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; };
  async function act(a, i, j) {
    const W = C.work[i];
    if (a === 'up') { mv(C.work, i, -1); dropStyles('work.'); }
    else if (a === 'down') { mv(C.work, i, 1); dropStyles('work.'); }
    else if (a === 'del') { if (!confirm('¿Eliminar este trabajo?')) return; C.work.splice(i, 1); dropStyles('work.'); }
    else if (a === 'before' || a === 'after') { const p = await pickImage(a === 'before' ? 'Imagen BEFORE' : 'Imagen AFTER', W[a]); if (!p) return; W[a] = p; }
    else if (a === 'media') {
      const r = await ask({ title: 'Cambiar video', fields: [{ k: 'u', label: W.type === 'video' ? 'URL directa del archivo (.mp4)' : `Link de ${W.type === 'youtube' ? 'YouTube' : 'Vimeo'}`, ph: 'https://…' }] });
      if (!r || !r.u.trim()) return;
      if (W.type === 'video') W.src = r.u.trim();
      else { const id = (W.type === 'youtube' ? ytId : vimeoId)(r.u); if (!id) return alert('No pude leer el ID del video. Pegá el link completo.'); W.videoId = id; }
    }
    else if (a === 'addtag') W.tags.push('Etiqueta');
    else if (a === 'deltag') { W.tags.splice(j, 1); dropStyles(`work.${i}.tags.`); }
    else if (a === 'addwork') {
      const r = await ask({ title: 'Nuevo trabajo', fields: [{ k: 't', type: 'select', label: 'Tipo', options: ['Before / After (fotos)', 'YouTube', 'Vimeo', 'Video por URL (.mp4)'] }] });
      if (!r) return;
      const base = { title: 'Nuevo proyecto', tags: ['Video', 'Etiqueta'] };
      if (r.t.startsWith('Before')) C.work.push({ ...base, tags: ['Foto', 'Etiqueta'], type: 'slider', before: '', after: '' });
      else if (r.t === 'YouTube') C.work.push({ ...base, type: 'youtube', videoId: '' });
      else if (r.t === 'Vimeo') C.work.push({ ...base, type: 'vimeo', videoId: '' });
      else C.work.push({ ...base, type: 'video', src: '' });
    }
    else if (a === 'addp') C.about.paragraphs.push('Nuevo párrafo.');
    else if (a === 'delp') { C.about.paragraphs.splice(i, 1); dropStyles('about.paragraphs.'); }
    else if (a === 'addsvc') C.about.services.push('Nuevo servicio');
    else if (a === 'delsvc') { C.about.services.splice(i, 1); dropStyles('about.services.'); }
    else if (a === 'addlink') {
      const r = await ask({ title: 'Nuevo contacto', fields: [{ k: 'l', label: 'Texto visible', ph: '@usuario' }, { k: 'h', label: 'Link', ph: 'https://… o mailto:…' }] });
      if (!r || !r.l.trim()) return; C.contact.links.push({ label: r.l.trim(), href: r.h.trim() });
    }
    else if (a === 'editlink') {
      const r = await ask({ title: 'Editar link', fields: [{ k: 'h', label: 'Link', value: C.contact.links[i].href, hint: 'El texto visible se edita haciendo clic sobre él.' }] });
      if (!r) return; C.contact.links[i].href = r.h.trim();
    }
    else if (a === 'dellink') { C.contact.links.splice(i, 1); dropStyles('contact.links.'); }
    dirty = true; render();
  }

  async function settings() {
    const c = cfgGet(), t = C.theme;
    const r = await ask({ title: 'Ajustes', ok: 'Guardar', fields: [
      { k: 'title', label: 'Título de la pestaña', value: C.site.title },
      { k: 'fd', type: 'select', label: 'Fuente de títulos', options: Object.keys(DISPLAY), value: t.fontDisplay },
      { k: 'fb', type: 'select', label: 'Fuente de texto', options: Object.keys(BODY), value: t.fontBody },
      { k: 'accent', type: 'color', label: 'Color de acento', value: t.accent },
      { k: 'bg', type: 'color', label: 'Color de fondo', value: t.bg },
      { k: 'text', type: 'color', label: 'Color de texto', value: t.text },
      { k: 'repo', label: 'Repositorio GitHub (usuario/repo)', value: c.repo || guessRepo() },
      { k: 'branch', label: 'Rama', value: c.branch || 'main' },
      { k: 'token', type: 'password', label: 'Token de GitHub', value: c.token || '', hint: 'Se guarda solo en este navegador. Nunca va al código de la página.' }
    ] });
    if (!r) return false;
    C.site.title = r.title; Object.assign(C.theme, { fontDisplay: r.fd, fontBody: r.fb, accent: r.accent, bg: r.bg, text: r.text });
    cfgSet({ repo: r.repo.trim(), branch: r.branch.trim() || 'main', token: r.token.trim() });
    dirty = true; render(); return true;
  }

  /* ───────── GitHub ───────── */
  const ghReq = (path, o = {}) => { const c = cfgGet(); return fetch(`https://api.github.com/repos/${c.repo}/contents/${path}`, { method: o.method || 'GET', headers: { Authorization: 'Bearer ' + c.token, Accept: 'application/vnd.github+json' }, body: o.body && JSON.stringify(o.body) }); };
  const b64utf8 = s => { let b = ''; new TextEncoder().encode(s).forEach(x => b += String.fromCharCode(x)); return btoa(b); };
  async function ghPut(path, content, message) {
    const br = cfgGet().branch || 'main';
    const g = await ghReq(`${path}?ref=${encodeURIComponent(br)}`);
    const sha = g.ok ? (await g.json()).sha : undefined;
    const r = await ghReq(path, { method: 'PUT', body: { message, content, branch: br, sha } });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).message || r.status);
  }
  const status = (m, err) => { const s = $('#st'); if (s) { s.textContent = m; s.className = err ? 'err' : ''; } };
  async function publish() {
    const c = cfgGet();
    if (!c.token || !c.repo) { if (!(await settings())) return; }
    status('Publicando…');
    try {
      for (const [p, b] of Object.entries(uploads)) { await ghPut(p, b, 'Subir ' + p); delete uploads[p]; }
      await ghPut('content.json', b64utf8(JSON.stringify(C, null, 2) + '\n'), 'Actualizar contenido del portfolio');
      dirty = false; status('Publicado ✓ La web se actualiza en 1–2 min.');
    } catch (e) { status('Error: ' + e.message + ' — revisá repo, rama y token en Ajustes.', true); }
  }

  /* ───────── Init ───────── */
  async function load() {
    const c = cfgGet();
    if (editing && c.token && c.repo) {
      try {
        const r = await ghReq(`content.json?ref=${encodeURIComponent(c.branch || 'main')}`);
        if (r.ok) { const j = await r.json(); return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\n/g, '')), ch => ch.charCodeAt(0)))); }
      } catch {}
    }
    return (await fetch('content.json?t=' + Date.now())).json();
  }

  document.addEventListener('input', e => { const el = e.target.closest?.('[data-p]'); if (editing && el) set(el.dataset.p, el.textContent); });
  document.addEventListener('keydown', e => { if (editing && e.key === 'Enter' && e.target.closest?.('[data-p]')) { e.preventDefault(); e.target.blur(); } });
  document.addEventListener('paste', e => { if (editing && e.target.closest?.('[data-p]')) { e.preventDefault(); document.execCommand('insertText', false, e.clipboardData.getData('text/plain').replace(/\s+/g, ' ')); } });
  document.addEventListener('click', e => {
    if (!editing) return;
    const b = e.target.closest('[data-act]');
    if (b) { e.preventDefault(); act(b.dataset.act, +b.dataset.i, +b.dataset.j); return; }
    if (e.target.closest('a.contact-link, a.nav-logo')) e.preventDefault();
  });
  const tb = $('#tb'), hm = $('#tbm'); let drag = null;
  document.addEventListener('focusin', e => { const el = e.target.closest?.('[data-p]'); if (editing && el) { cur = el; tb.hidden = false; placeTb(); } });
  document.addEventListener('focusout', e => { if (editing && e.target.closest?.('[data-p]')) setTimeout(() => { if (!document.activeElement?.closest?.('[data-p]')) { tb.hidden = true; cur = null; } }, 0); });
  window.addEventListener('scroll', placeTb, { passive: true });
  tb.addEventListener('mousedown', e => e.preventDefault());
  tb.addEventListener('click', e => {
    const b = e.target.closest('[data-t]'); if (!b || !cur) return;
    upd(st => {
      const s = st.s || 1, t = b.dataset.t;
      if (t === 'up') st.s = Math.min(3, Math.round((s + 0.1) * 100) / 100);
      else if (t === 'dn') st.s = Math.max(0.4, Math.round((s - 0.1) * 100) / 100);
      else { delete st.s; delete st.x; delete st.y; }
    });
  });
  /* Guías de alineación (imán). Mantené Alt apretado para mover sin imán. */
  const SNAP = 6;
  const rectOf = el => { const g = document.createRange(); g.selectNodeContents(el); const b = g.getBoundingClientRect(); return b.width ? b : el.getBoundingClientRect(); };
  const snapAxis = (vals, targets) => { let best = null; for (const v of vals) for (const t of targets) { const d = t - v; if (Math.abs(d) <= SNAP && (best === null || Math.abs(d) < Math.abs(best.d))) best = { d, t }; } return best; };
  const guides = $('#guides');
  const drawGuides = (vx, hy) => { guides.innerHTML = (vx != null ? `<i class="gl gv" style="left:${vx}px"></i>` : '') + (hy != null ? `<i class="gl gh" style="top:${hy}px"></i>` : ''); };
  hm.addEventListener('pointerdown', e => {
    if (!cur) return;
    const st = C.style?.[cur.dataset.p] || {}, r0 = rectOf(cur);
    const xt = [innerWidth / 2], yt = [];
    document.querySelectorAll('[data-p]').forEach(el => {
      if (el === cur) return; const r = rectOf(el); if (!r.width || !r.height) return;
      xt.push(r.left, r.left + r.width / 2, r.right); yt.push(r.top, r.top + r.height / 2, r.bottom);
    });
    drag = { x0: e.clientX, y0: e.clientY, sx: st.x || 0, sy: st.y || 0, r0, xt, yt };
    hm.setPointerCapture(e.pointerId); e.preventDefault();
  });
  hm.addEventListener('pointermove', e => {
    if (!drag) return;
    let x = drag.sx + e.clientX - drag.x0, y = drag.sy + e.clientY - drag.y0, vx = null, hy = null;
    if (!e.altKey) {
      const { r0 } = drag, L = r0.left + (x - drag.sx), T = r0.top + (y - drag.sy);
      const bx = snapAxis([L, L + r0.width / 2, L + r0.width], drag.xt); if (bx) { x += bx.d; vx = bx.t; }
      const by = snapAxis([T, T + r0.height / 2, T + r0.height], drag.yt); if (by) { y += by.d; hy = by.t; }
    }
    upd(st => { st.x = Math.round(x); st.y = Math.round(y); });
    drawGuides(vx, hy);
  });
  const endDrag = () => { drag = null; drawGuides(null, null); };
  hm.addEventListener('pointerup', endDrag); hm.addEventListener('pointercancel', endDrag);
  window.addEventListener('beforeunload', e => { if (editing && dirty) { e.preventDefault(); e.returnValue = ''; } });

  load().then(async data => {
    C = data; render();
    if (!editing) return;
    document.body.classList.add('editing');
    const bar = $('#bar'); bar.hidden = false;
    bar.innerHTML = `<span id="st">Modo edición: hacé clic sobre cualquier texto para cambiarlo.</span><button id="bS">Ajustes</button><button id="bX">Salir</button><button id="bP" class="pri">Publicar</button>`;
    $('#bS').onclick = settings; $('#bP').onclick = publish;
    $('#bX').onclick = () => { if (!dirty || confirm('Hay cambios sin publicar. ¿Salir igual?')) { dirty = false; location.href = location.pathname; } };
    const c = cfgGet();
    if (!c.token) { status('Primero cargá tu repositorio y token.'); await settings(); }
  }).catch(err => { $('#app').innerHTML = `<p style="padding:3rem">No se pudo cargar content.json (${esc(err.message)}). Abrí la página desde un servidor, no haciendo doble clic en el archivo.</p>`; });
})();
</script>
</body>
</html>
